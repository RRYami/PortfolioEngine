services:
  postgres:
    # TimescaleDB on PG16. Note: a volume initialized by plain postgres must be
    # wiped (make db-reset) — TimescaleDB needs shared_preload_libraries.
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ptf
      POSTGRES_PASSWORD: ptf
      POSTGRES_DB: ptf_engine
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptf -d ptf_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Python price/FX service: yfinance -> DuckDB -> Parquet export.
  prices:
    build: ./services/prices
    ports:
      - "8001:8001"
    environment:
      # Optional. When set, fetched closes and rates are written to
      # market.equity_close / market.fx_rate as well as DuckDB, so the API's
      # Postgres source sees them without a manual backfill. Unset, the
      # service behaves exactly as before.
      DATABASE_URL: postgres://ptf:ptf@postgres:5432/ptf_engine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Bind-mounted rather than a named volume so the host and the containers
      # share one directory. The option pipeline runs on the host -- the
      # Databento ingest and `ptf-surface` both write here -- and with a managed
      # volume none of that output was reachable from inside a container, so
      # holding an option was impossible under compose however the API was
      # configured.
      - ./services/prices/data:/data

  # Rust analytics engine API. Reads the Parquet snapshot from the shared
  # volume and calls the prices service over the network for ensure-on-add.
  api:
    build:
      context: .
      dockerfile: crates/api/Dockerfile
    environment:
      PTF_PRICES: postgres
      PRICES_URL: http://prices:8001
      # Only read when DATABASE_URL is absent. Kept so the no-database path
      # still works in the container: without PTF_SURFACES the fallback
      # resolves relative to the working directory, which does not exist here,
      # and every option add fails as though no surface had been built.
      PRICES_PARQUET: /data/prices.parquet
      FX_PARQUET: /data/fx.parquet
      PTF_SURFACES: /data
      PTF_API_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://ptf:ptf@postgres:5432/ptf_engine
    ports:
      - "8080:8080"
    volumes:
      - ./services/prices/data:/data:ro
    depends_on:
      prices:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Next.js dashboard. The browser hits the frontend's own /api proxies, which
  # server-side fetch the engine API over the compose network.
  frontend:
    build: ./frontend
    environment:
      PTF_API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
