[package]
name = "ptf-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ptf-api"
path = "src/main.rs"

[dependencies]
ptf-engine = { path = "../engine", features = ["serde", "in-memory-repo"] }
ptf-persistence = { path = "../persistence" }
rust_decimal = { workspace = true, features = ["serde-with-str"] }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arrow = "54"
parquet = "54"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Keep this set in sync: axum-login 0.18 and tower-sessions-sqlx-store 0.15
# both target tower-sessions 0.14.
axum-login = "0.18.0"
tower-sessions = "0.14.0"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
password-auth = "1.0.0"
tower-governor = { version = "0.8.0", package = "tower_governor" }
sqlx = { workspace = true }
async-trait = { workspace = true }
tower_governor = "0.8.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
